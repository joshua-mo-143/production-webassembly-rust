name: Build release bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version (letters, digits, dots, underscores, hyphens)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Must precede the cache step: rust-cache derives its key from the
      # active rustc, so caching before this would key on the runner default.
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1

      - name: Build deterministic bundle and CycloneDX 1.6 SBOM
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
        run: ./scripts/package-release.sh "$BUNDLE_VERSION"

      - name: Attest bundle provenance
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/production-webassembly-rust-${{ inputs.version }}.tar.gz

      - name: Upload bundle and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-webassembly-rust-${{ inputs.version }}
          path: |
            dist/production-webassembly-rust-${{ inputs.version }}.tar.gz
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
