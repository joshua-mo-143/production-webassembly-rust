name: Build release bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version (letters, digits, dots, underscores, hyphens)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must precede the cache step: rust-cache derives its key from the
      # active rustc, so caching before this would key on the runner default.
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build deterministic bundle and CycloneDX 1.6 SBOM
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
        run: ./scripts/package-release.sh "$BUNDLE_VERSION"

      - name: Attest bundle provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/production-webassembly-rust-${{ inputs.version }}.tar.gz

      - name: Upload bundle and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-webassembly-rust-${{ inputs.version }}
          path: |
            dist/production-webassembly-rust-${{ inputs.version }}.tar.gz
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
