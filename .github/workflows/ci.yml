name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build all native targets
        run: cargo build --workspace --all-targets --locked

      - name: Lint native targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint component guests
        run: >-
          cargo clippy --target wasm32-wasip2 --locked
          -p ch04-guest -p ch05-guest -p ch06-guest
          -p ch07-guest -p ch08-guest -p ch10-guest
          -p ch11-plugin-v1 -p ch11-plugin-v1-1 -p ch12-guest
          -p ch13-catalog -p ch13-renderer
          -p ch14-normalizer -p ch14-workspace-reader --
          -D warnings -A clippy::same-length-and-capacity

      - name: Build component guests
        run: |
          cargo build --target wasm32-wasip2 --locked \
            -p ch04-guest -p ch05-guest -p ch07-guest -p ch08-guest \
            -p ch10-guest -p ch11-plugin-v1 -p ch11-plugin-v1-1 \
            -p ch12-guest -p ch13-catalog -p ch13-renderer \
            -p ch14-normalizer -p ch14-workspace-reader
          cargo build --release --target wasm32-wasip2 --locked -p ch06-guest

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run Chapter 5 compatibility test
        env:
          CH05_COMPONENT: target/wasm32-wasip2/debug/ch05_guest.wasm
        run: cargo test --locked -p ch05-host --test compatibility -- --ignored

      - name: Run Chapter 7 containment test
        env:
          CH07_COMPONENT: target/wasm32-wasip2/debug/ch07_guest.wasm
        run: cargo test --locked -p ch07-host --test containment -- --ignored

      - name: Run Chapter 8 capability test
        env:
          CH08_COMPONENT: target/wasm32-wasip2/debug/ch08_guest.wasm
        run: cargo test --locked -p ch08-host --test capabilities -- --ignored

      - name: Run Chapter 10 server runtime test
        env:
          CH10_COMPONENT: target/wasm32-wasip2/debug/ch10_guest.wasm
        run: cargo test --locked -p ch10-host --test server_runtime -- --ignored

      - name: Run Chapter 11 plugin system tests
        env:
          CH11_PLUGIN_V1: target/wasm32-wasip2/debug/ch11_plugin_v1.wasm
          CH11_PLUGIN_V1_1: target/wasm32-wasip2/debug/ch11_plugin_v1_1.wasm
        run: cargo test --locked -p ch11-host --test plugin_system -- --ignored

      - name: Run Chapter 12 agent tool boundary tests
        env:
          CH12_COMPONENT: target/wasm32-wasip2/debug/ch12_guest.wasm
        run: cargo test --locked -p ch12-host --test agent_tools -- --ignored

      - name: Run Chapter 13 component composition tests
        env:
          CH13_CATALOG: target/wasm32-wasip2/debug/ch13_catalog.wasm
          CH13_RENDERER: target/wasm32-wasip2/debug/ch13_renderer.wasm
        run: cargo test --locked -p ch13-host --test composition -- --ignored

      - name: Run Chapter 14 secure runtime tests
        run: |
          cargo run --locked -p ch14-host -- provision
          cargo test --locked -p ch14-host -- --ignored

      - name: Run documented examples
        run: |
          cargo run --locked -p ch04-host
          cargo run --locked -p ch05-host
          cargo run --locked --release -p ch06-host -- \
            target/wasm32-wasip2/release/ch06_guest.wasm 100 5
          cargo run --locked -p ch07-host
          cargo run --locked -p ch08-host
          cargo run --locked -p ch10-host
          cargo run --locked -p ch11-host
          cargo run --locked -p ch12-host
          cargo run --locked -p ch13-host
          cargo run --locked -p ch14-host -- run
