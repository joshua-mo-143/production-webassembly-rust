[workspace]
members = [
    "examples/ch04-first-module/guest",
    "examples/ch04-first-module/host",
    "examples/ch05-stable-api/guest",
    "examples/ch05-stable-api/host",
    "examples/ch06-data-exchange/guest",
    "examples/ch06-data-exchange/host",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
