[package]
name = "ch10-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "ch10-host"

[[bin]]
name = "ch10-http-server"
path = "src/bin/http_server.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util"] }
wasmtime = { version = "48.0.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48.0.0", default-features = false, features = ["p2"] }

[lints]
workspace = true
