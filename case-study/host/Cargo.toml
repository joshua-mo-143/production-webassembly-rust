[package]
name = "ch14-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
ed25519-dalek = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
